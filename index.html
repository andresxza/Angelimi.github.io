<style>
:root{--wine:#5b1b2a;--wine2:#7a2438;--cream:#efe4cb;--lace:#f5eedb;--sage:#8fa37c;--ink:#43181f;--gold:#cfa957;--script:"Great Vibes",cursive;--serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;--hand:"Libre Baskerville",Georgia,serif;--cap:"DM Sans",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.sc{height:100vh;height:100svh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 22px calc(env(safe-area-inset-bottom,0px) + 30px);overflow:hidden}
.t-wine{background:radial-gradient(120% 80% at 50% 40%,#0000,#1f060c99),radial-gradient(circle,#d9c7a455 0 1.4px,#0000 2px) 0 0/44px 44px,repeating-linear-gradient(0deg,#ffffff0b 0 1px,#0000 1px 3px),repeating-linear-gradient(90deg,#0000002a 0 1px,#0000 1px 3px),var(--wine)}
.t-sage{background:radial-gradient(120% 80% at 50% 40%,#0000,#2a3a2899),repeating-linear-gradient(45deg,#ffffff10 0 1px,#0000 1px 4px),repeating-linear-gradient(-45deg,#0000001c 0 1px,#0000 1px 4px),#7e9470;color:#f6f0df}
.t-knit{background:radial-gradient(120% 80% at 50% 40%,#fff3,#8a6f4a44),repeating-linear-gradient(90deg,#0000000d 0 3px,#ffffff44 3px 6px,#0000 6px 20px),#eadfc4;color:var(--ink)}
.k{font:500 .72rem var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}.t-knit .k,.lace .k{color:var(--wine2)}

.mini{font:400 .8rem var(--sans);opacity:.75;margin:8px 0 0}
.rv{opacity:0;transform:translateY(16px);transition:opacity 520ms ease-out,transform 620ms var(--slide-ease);transition-delay:calc(var(--i,0)*55ms)}.in .rv{opacity:1;transform:none}
#nv{position:fixed;right:10px;top:50%;translate:0 -50%;z-index:6;display:flex;flex-direction:column;gap:11px}#nv i{width:7px;height:7px;border-radius:50%;background:#ffffff55;cursor:pointer;transition:.4s;box-shadow:0 0 0 1px #0003}#nv i.on{background:var(--gold);transform:scale(1.6)}
.btn{font:500 .95rem var(--sans);color:var(--cream);background:#ffffff14;border:1px solid var(--gold);border-radius:99px;padding:11px 26px;cursor:pointer;text-decoration:none;display:inline-block;transition:background .3s,transform .2s}.btn:hover{background:#cfa95733}.btn:active{transform:scale(.96)}
#mc{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:9;display:flex;align-items:center;gap:10px;background:#2a0b1299;padding:4px 8px;border-radius:99px;backdrop-filter:blur(6px)}#mu{padding:6px 14px;font-size:.8rem}#trk{max-width:150px;padding:7px 8px;border:1px solid var(--gold);border-radius:99px;background:#2a0b12;color:var(--cream);font:500 .75rem var(--sans)}.volume-control{display:flex;align-items:center;gap:5px;font:500 .7rem var(--sans);color:var(--cream);white-space:nowrap}#vl{width:80px;accent-color:#cfa957}#volume-value{min-width:2.4em;text-align:right}
.cue{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;opacity:.7;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{translate:0 7px}}
.hide{display:none!important}
body.waiting{overflow:hidden}

#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;min-height:100vh;min-height:100svh;padding:20px;overflow-y:auto;color:#f5eddf;background:radial-gradient(ellipse at 50% 42%,#8c35414d,transparent 48%),radial-gradient(ellipse at 50% 100%,#421320,#190811 76%),#190811}
#gate[hidden]{display:none}
#gate::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle,#f4d18a 0 1px,#0000 1.8px) 0 0/83px 83px,radial-gradient(circle,#fff1d2 0 .7px,#0000 1.7px) 34px 21px/117px 117px;opacity:.5;animation:gate-stars 18s linear infinite}
#gate::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 25%,#08040b80 100%);animation:gate-glow 5s ease-in-out infinite alternate}
#gate.leaving{opacity:0;pointer-events:none;transition:opacity 1.1s ease}
.gate-lace{position:absolute;inset:0 auto 0 58%;width:28px;opacity:.72;background:repeating-linear-gradient(0deg,#f6f1e7 0 3px,#b6b09f 3px 4px,#f6f1e7 4px 7px);box-shadow:0 0 12px #24351d33}
.gate-finale{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.gate-rays{position:absolute;left:50%;top:47%;width:150vmax;aspect-ratio:1;translate:-50% -50%;background:repeating-conic-gradient(from 0deg,#ffe6ab00 0deg 5deg,#ffe6ab77 5deg 7deg,transparent 7deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 0 8%,transparent 66%);mask-image:radial-gradient(circle,#000 0 8%,transparent 66%);opacity:0}
.gate-bloom{position:absolute;left:50%;top:47%;width:24vmin;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,#fffdf0 0,#ffe7a9dc 8%,#f0bd6266 35%,transparent 72%);filter:blur(5px);opacity:0}
.gate-ring{position:absolute;left:50%;top:47%;width:clamp(100px,26vmin,260px);aspect-ratio:1;translate:-50% -50%;border:1px solid #fff2c9cc;border-radius:50%;box-shadow:0 0 18px #ffe4a988,inset 0 0 20px #ffe4a944;opacity:0}
.gate-ring-secondary{position:absolute;left:50%;top:47%;width:clamp(150px,38vmin,360px);aspect-ratio:1;translate:-50% -50%;border:1px solid #d9b55f66;border-radius:50%;box-shadow:0 0 12px #e4c36f33;opacity:0}
.gate-spark-field{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.gate-spark-field i{position:absolute;left:50%;top:47%;width:4px;height:4px;border-radius:50%;background:#fff4ce;box-shadow:0 0 9px #ffe49a;opacity:0;transform:rotate(var(--spark-angle)) translateY(-12px)}
.gate-spark-field i:nth-child(1){--spark-angle:0deg}.gate-spark-field i:nth-child(2){--spark-angle:30deg}.gate-spark-field i:nth-child(3){--spark-angle:60deg}.gate-spark-field i:nth-child(4){--spark-angle:90deg}.gate-spark-field i:nth-child(5){--spark-angle:120deg}.gate-spark-field i:nth-child(6){--spark-angle:150deg}.gate-spark-field i:nth-child(7){--spark-angle:180deg}.gate-spark-field i:nth-child(8){--spark-angle:210deg}.gate-spark-field i:nth-child(9){--spark-angle:240deg}.gate-spark-field i:nth-child(10){--spark-angle:270deg}.gate-spark-field i:nth-child(11){--spark-angle:300deg}.gate-spark-field i:nth-child(12){--spark-angle:330deg}
.gate-card{position:relative;z-index:2;width:min(100%,480px);padding:clamp(22px,6vw,36px);border:1px solid #e5ca80;border-radius:4px;background:repeating-linear-gradient(0deg,#ffffff0b 0 1px,#0000 1px 5px),#f5eddf;box-shadow:0 28px 80px #08040ab3,0 0 28px #e0b55233,0 0 0 7px #f5eddf20,0 0 0 8px #e5c77799;text-align:center;animation:gate-arrive .9s cubic-bezier(.2,.8,.2,1) both}
body.celebrating .gate-card{animation:gate-card-mystery 4.5s cubic-bezier(.22,.72,.24,1) both}
body.celebrating .gate-rays{animation:gate-rays-mystery 4.5s ease-in-out both}
body.celebrating .gate-bloom{animation:gate-bloom-mystery 4.3s ease-out both}
body.celebrating .gate-ring{animation:gate-ring-mystery 4.2s cubic-bezier(.2,.7,.25,1) both}
body.celebrating .gate-ring-secondary{animation:gate-ring-mystery 4.4s .35s cubic-bezier(.2,.7,.25,1) both}
body.celebrating .gate-spark-field i{animation:gate-spark-mystery 2.8s var(--spark-delay,.08s) cubic-bezier(.15,.7,.25,1) both}
body.celebrating .gate-title{animation:gate-title-mystery 4.5s ease-in both}
.gate-spark-field i:nth-child(1){--spark-delay:.02s}.gate-spark-field i:nth-child(2){--spark-delay:.09s}.gate-spark-field i:nth-child(3){--spark-delay:.14s}.gate-spark-field i:nth-child(4){--spark-delay:.05s}.gate-spark-field i:nth-child(5){--spark-delay:.16s}.gate-spark-field i:nth-child(6){--spark-delay:.11s}.gate-spark-field i:nth-child(7){--spark-delay:.13s}.gate-spark-field i:nth-child(8){--spark-delay:.07s}.gate-spark-field i:nth-child(9){--spark-delay:.18s}.gate-spark-field i:nth-child(10){--spark-delay:.04s}.gate-spark-field i:nth-child(11){--spark-delay:.15s}.gate-spark-field i:nth-child(12){--spark-delay:.1s}
body.celebrating .gate-date,body.celebrating .gate-countdown,body.celebrating .gate-sound{animation:gate-detail-out .55s .12s ease-in both}
.gate-card::before{content:"";position:absolute;inset:9px;border:1px solid #a68a5c77;pointer-events:none}
.gate-corner{position:absolute;width:25px;height:25px;color:#84263a;font:1.2rem/1 var(--serif)}
.gate-corner.tl{top:13px;left:15px}.gate-corner.tr{top:13px;right:15px}.gate-corner.bl{bottom:13px;left:15px}.gate-corner.br{bottom:13px;right:15px}
.gate-scene{position:relative;width:210px;height:130px;margin:0 auto 2px;animation:gate-float 4s ease-in-out infinite}
.gate-envelope{position:absolute;left:50%;bottom:3px;z-index:1;width:174px;height:112px;translate:-50% 0;filter:drop-shadow(0 13px 12px #16050bab) drop-shadow(0 0 8px #d6a64b44);animation:gate-envelope-sway 5s ease-in-out infinite}
body.celebrating .gate-envelope{animation:gate-envelope-mystery 4.5s cubic-bezier(.2,.75,.25,1) both}
.gate-envelope::before{content:"";position:absolute;inset:-18px;border:1px solid #ffe8ad99;border-radius:50%;box-shadow:0 0 14px #ffe49a77,inset 0 0 14px #ffe49a44;opacity:0;pointer-events:none}

.gate-back{position:absolute;inset:0;border-radius:5px;background:#6c2030}
.gate-letter{position:absolute;left:11%;top:-12%;width:78%;height:92%;border:1px solid #d5cfbc;background:#f8f3e7;box-shadow:0 2px 6px #34432f22}

.gate-letter::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(110deg,transparent 28%,#fff8 45%,#ffe8b6 50%,#fff8 55%,transparent 72%);opacity:0;transform:translateX(-110%);pointer-events:none}

.gate-letter::after{content:"";position:absolute;inset:10px 15px;border-top:1px solid #b1b99d;border-bottom:1px solid #b1b99d;opacity:.7}
.gate-front{position:absolute;inset:0;border-radius:5px;background:linear-gradient(115deg,transparent 38%,#ffffff22 50%,transparent 62%),linear-gradient(145deg,#bd5b66,#761d32);background-size:240% 100%,100% 100%;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);animation:gate-wrap-shine 5s ease-in-out infinite}

.gate-flap{position:absolute;inset:0 0 auto;height:68%;border-radius:5px 5px 0 0;background:linear-gradient(150deg,#812639,#b24b58);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 2px 1px #43101e88)}

.gate-seal{position:absolute;left:50%;top:56%;display:grid;place-items:center;width:38px;height:38px;translate:-50% -50%;border:1px solid #fff0b2;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff0bd,#d7a747 67%,#8e5a1d);box-shadow:0 3px 9px #300b17aa;color:#761d32;font:1.3rem/1 var(--serif);animation:gate-pulse 2.1s ease-in-out infinite}

.gate-bow{position:absolute;top:2px;right:3px;z-index:2;width:66px;rotate:12deg;transform-origin:center;filter:drop-shadow(0 3px 2px #34432f33);animation:gate-bow 3.4s ease-in-out infinite}
body.celebrating .gate-bow{animation:gate-bow-release 1s 2.8s cubic-bezier(.2,.8,.3,1) both}
.gate-title{position:relative;margin:0;color:#6b1a31;font:400 clamp(2.8rem,12vw,4rem)/1 var(--script);text-shadow:0 1px #fff9}
.gate-date{position:relative;margin:4px 0 0;color:#6b4c39;font:600 .66rem var(--sans);letter-spacing:.16em}
.gate-countdown{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0 2px;padding:16px 0 6px;border-top:1px solid #a78d55}
.gate-countdown>div{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.gate-countdown>div:not(:last-child)::after{content:":";position:absolute;right:-7px;top:20px;color:#a78d55;font:600 1rem/1 var(--serif);opacity:.85}
.gate-countdown .gate-ring-value{position:relative;width:clamp(62px,17vw,82px);aspect-ratio:1.16;display:block;overflow:visible;perspective:700px;border:1px solid #b8914f;border-radius:9px;background:linear-gradient(145deg,#7a263a,#4c1223);box-shadow:0 13px 18px #29120f55,inset 0 2px 2px #fff3,inset 0 -5px 8px #21071199;transform-style:preserve-3d}
.gate-countdown .gate-ring-value::before{content:"";position:absolute;inset:0;z-index:4;border-radius:8px;pointer-events:none;background:linear-gradient(115deg,#fff0 20%,#fff2 48%,#fff0 68%);opacity:.3}

.flip-top,.flip-bottom{position:absolute;left:0;right:0;z-index:4;height:50%;overflow:hidden;font-size:0;backface-visibility:hidden}
.flip-top{top:0;background:linear-gradient(145deg,#8b3045,#501426);border-radius:8px 8px 0 0}
.flip-bottom{bottom:0;background:linear-gradient(145deg,#8b3045,#501426);border-radius:0 0 8px 8px}
.flip-top::before,.flip-bottom::before,.flip-leaf-front::before,.flip-leaf-back::before{position:absolute;left:0;right:0;height:200%;display:grid;place-items:center;color:#f8e6b2;font:600 clamp(1.7rem,6vw,2.25rem)/1 var(--serif);font-variant-numeric:tabular-nums;text-shadow:0 2px 1px #260b16aa}
.flip-top::before{content:attr(data-digit);top:0}
.flip-bottom::before{content:attr(data-digit);bottom:0}
.gate-ring-value.flipping .flip-top::before,.gate-ring-value.flipping .flip-bottom::before{animation:flip-clock-number .62s cubic-bezier(.2,.8,.2,1) both}
.flip-leaf{position:absolute;left:0;right:0;top:0;height:50%;z-index:3;transform-origin:bottom;transform-style:preserve-3d;visibility:hidden}
.flip-leaf-front,.flip-leaf-back{position:absolute;inset:0;overflow:hidden;font-size:0;backface-visibility:hidden;border-radius:8px 8px 0 0}
.flip-leaf-front{background:linear-gradient(145deg,#8b3045,#501426)}

.flip-leaf-front::before{content:attr(data-digit);top:0}
.flip-leaf-back::before{content:attr(data-digit);bottom:0}
.flip-clock-value{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.gate-ring-value.flipping .flip-leaf{visibility:visible;animation:flip-clock-leaf .62s cubic-bezier(.35,.05,.25,1) both}
.gate-countdown span{color:#6b4c39;font-size:.55rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.gate-sound{margin-top:13px;padding:8px 15px;border:1px solid #b8914f;border-radius:99px;background:#6b1a3110;color:#6b1a31;font:500 .72rem var(--sans);letter-spacing:.04em;cursor:pointer;transition:background .2s,opacity .2s}
.gate-sound:hover{background:#d7a74733}.gate-sound:disabled{opacity:.7;cursor:default}
.gate-challenge{position:relative;margin-top:8px;padding:8px 4px 2px}
.gate-challenge[hidden]{display:none}
.gate-challenge h2{margin:4px 0 6px;color:#6b1a31;font:400 clamp(1.8rem,8vw,2.5rem)/1 var(--script)}
.challenge-kicker{margin:0;color:#9a6840;font:700 .58rem var(--sans);letter-spacing:.19em;text-transform:uppercase}
.challenge-copy,.challenge-status{min-height:18px;margin:8px 0;color:#6b4c39;font:600 .72rem var(--sans)}
.challenge-score{display:flex;justify-content:space-between;margin:10px 2px 8px;color:#8b2e43;font:700 .68rem var(--sans);letter-spacing:.08em;text-transform:uppercase}
.challenge-memory{position:relative;width:min(310px,82vw);height:210px;margin:8px auto 0;padding:8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:7px;overflow:hidden;border:1px solid #d9bd7d;border-radius:18px;background:radial-gradient(circle at 50% 45%,#fff9e6 0 4%,#f1d49a55 10%,transparent 30%),linear-gradient(145deg,#fffaf0,#eadcc1);box-shadow:inset 0 0 28px #8d5a6720,0 12px 24px #5a1b2a18;touch-action:manipulation}
.memory-card{position:relative;min-width:0;min-height:0;padding:0;border:0;border-radius:9px;background:transparent;perspective:850px;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 5px 5px #3a15274d)}
.memory-card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .78s cubic-bezier(.18,.78,.22,1)}

.memory-card-front,.memory-card-back{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;border:1px solid #d5bb78;border-radius:9px;backface-visibility:hidden;font:700 clamp(1.05rem,5vw,1.5rem)/1 var(--serif)}
.memory-card-front{background:radial-gradient(circle at 50% 50%,#b6565e 0 1px,transparent 1.5px) 0 0/9px 9px,linear-gradient(145deg,#892d43,#501426);box-shadow:inset 0 1px 4px #fff5,inset 0 -5px 10px #260b16aa,0 2px 3px #37101d;color:#ecd38d}
.memory-card-front::before,.memory-card-back::before{position:absolute;inset:4px;display:grid;place-items:center;border:1px solid #e6ca82a8;border-radius:6px;content:"✿";text-shadow:0 1px #fff5}
.memory-card-front::after{position:absolute;inset:9px;content:"";border:1px solid #e6ca824d;border-radius:4px;background:linear-gradient(135deg,#fff3 0%,transparent 35%,transparent 66%,#0002 100%);pointer-events:none}
.memory-card-back{transform:rotateY(180deg);background:radial-gradient(circle at 50% 48%,#fff8df 0 1px,transparent 1.5px) 0 0/8px 8px,linear-gradient(145deg,#f7e8ba,#cfaa60);box-shadow:inset 0 1px 5px #fff,inset 0 -6px 12px #82582d66,0 2px 4px #5b341d;color:#702137}
.memory-card-back::before{inset:4px;border-color:#946a3599;content:""}
.memory-card-back::after{position:absolute;inset:8px;content:"";border:1px solid #946a354d;border-radius:4px;pointer-events:none}
.card-emblem{display:grid;width:44%;aspect-ratio:1;place-items:center;border:1px solid #a87b3d;border-radius:50%;background:radial-gradient(circle,#fff8df 0 42%,#e0bd72 100%);box-shadow:0 2px 6px #54253a55;color:#702137;font:700 clamp(1.05rem,5vw,1.5rem)/1 var(--serif);text-shadow:0 1px #fff8,0 2px 3px #54253a55}
.card-corner{position:absolute;z-index:1;color:#702137;font:700 .62rem/1 var(--serif)}
.card-corner.top{top:7px;left:8px}.card-corner.bottom{right:8px;bottom:7px;rotate:180deg}

 /* Para cambiar fotos, edita src en cada elemento de fotos.items. */
 fotos:{k:"Nosotros",t:"Nuestros momentos",hint:"toca la foto para darle la vuelta, y otra vez para que salga la siguiente muejejeje",

 ojos:{k:"Lo que veo en ti",t:"Tus hermosos ojos",l:"Dicen que los ojos son ventanas,\nlos tuyos son unicos \ndonde quisiera que me mires toda la vida\n\nlos miro y me pongo nervioso noshe porque\n.\n\nTócalos, parpadean para ti"},

 misterio:{k:"Modo incógnito",t:"Una fecha secreta",fecha:"",pista:"Pronto lo sabrás",l:"Hay un día que va a ser nuestro,\nuno que todavía no te puedo contar\n\nRaspa el sello con el dedo y mira si adivinas"},
 final:{k:"Para ti",q:"¿Quieres salir conmigo, Angeli?",
  carta:"Angi,\n\nno sé x dónde empezar emmm, así q empiezo x el principio: nos conocimos de una forma tan rara q hasta hoy me encanta\n\ny desde ahí no hay día q no quiera contarte algo, {cualqueir|cualquier} tontería, lo q sea\n\nme encantan nuestras llamadas, 2 horas o mas  contigo y siento q fueron 5 minutos, xq contigo el tiempo se {piede|pierde}, jjssjs\n\nme encanta esa enpatia que tienes, tu forma de hablar, de reírte, hasta lo celosa q eres, sí, jaja, q quieres q sea solo para ti, tranqui q yo solo tengo ojos pa ti y mi mama obvio\n\ny tus ojos, awww ay tus ojos {kjdhs|}me encantan, de verdad\n\nsomos el Team Nusita forever, aunque yo antes era blanco\n\nno quiero q esto se quede en un misterio, xq contigo todo se siente de verdad, así q sigue leyendo, q todavía hay más...",
  okQ:"Gracias, Angeli",okS:"Acabas de hacerme el día\nCaptura esta pantalla y mándamela,\nyo me encargo del resto del plan\n\n— Darwin"},
 noche:{t:"La noche que no quería que terminara",ctx:"Hay una noche que recuerdo más que muchas otras,\nla de aquella conversación que no quisimos cerrar",paras:["Creo que fue una de las primeras veces en las que sentí que realmente estábamos conectando. Incluso empezamos a hablar de nuestro futuro, de los lugares que queríamos conocer, de las cosas que haríamos juntos y de cómo sería nuestra vida si algún día conseguíamos cumplir todos aquellos planes. Y por alguna razón, en ese momento todo parecía tan fácil, como si de verdad pudiéramos hacerlo todo. Y yo no quería que aquella conversación terminara. Miraba la hora y no podía creer lo tarde que era. Sabía que al día siguiente tenía cosas que hacer, que debía dormir y que en algún momento tendríamos que despedirnos, pero yo no quería.",
  "Quería seguir escuchándote, seguir preguntándote cosas, contarte más sobre mí y saber qué más tenías para contarme. Era como si nunca se nos acabaran los temas y mientras más hablábamos, menos ganas tenía de dormir. Recuerdo que llegó un momento en el que ya no importaba nada de lo que estuviera pasando afuera. No importaba la hora ni lo que teníamos que hacer al día siguiente, ni siquiera el sueño que seguramente ya teníamos. Solo quería seguir ahí. Tú, yo y aquella conversación que me hubiera gustado que nunca haya tenido un final.",
  "Y es que es muy lindo encontrar a alguien con quien puedas hablar durante horas sin darte cuenta del tiempo. Alguien con quien no tienes que pensar demasiado qué decir. Espero que tú también recuerdes aquella noche tanto como yo y que no simplemente haya sido una conversación bonita antes de dormir. Para mí fue diferente. Recuerdo lo bien que me sentía, las ganas que tenía de seguir conociéndote y esa sensación de que por primera vez había encontrado a alguien con quien podía hablar de absolutamente todo.",
  "Y es que es como alguna vez lo dijo Fiódor Dostoievski: Quiero hablar de todo con al menos una persona, como hablo conmigo mismo. Quizá nunca volvamos a tener una conversación así, porque quizá no volvamos a hablar, o quizá nuestras vidas hayan tomado caminos diferentes. Pero si algo pudiera pedir, sería volver aquella noche, pero no para cambiar algo, simplemente para volver a quedarme despierto contigo, hablando de cualquier cosa mientras todos los demás dormían. Porque aquella noche no necesitaba nada más.",
  "Éramos tú y yo, conociéndonos un poquito más mientras el mundo dormía."]},
 tulipanes:{k:"Para ti",t:"Tulipanes",hint:"desata el moño y toca cada foto",items:[{src:"img/tulipan-1.jpg",c:"Tulipanes para ti"},{src:"img/tulipan-2.jpg",c:"Hasta de noche son bonitos"},{src:"img/tulipan-3.jpg",c:"Que brillen como tú"},{src:"img/tulipan-4.jpg",c:"Y un Snoopy que los cuida"}]},
 sorpresa:{k:"Algo escondido",t:"Una sorpresa escondida",ctx:"Todavía no se puede abrir\nPero está ahí, esperándote",msg:["Todavía no…","Paciencia, Angi","Aún no es el momento","Shhh, es un secreto"]},
 gato:["Aviso del gato: Darwin solo tiene ojos para una persona, los tuyos","El gato confirma: cero celos necesarios","Shhh, el gato sabe que Darwin ensayó esta carta varias veces"],
 noTxt:["No","¿Segura?","Piénsalo","Casi…","Bueno… sí"],
 colores:["#e8869a","#d6566f","#f3c4cd","#c93d5a","#f0a35c"]
};
/* ===== fin de la zona editable ===== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
$$("[data-t]").forEach(e=>e.textContent=e.dataset.t.split(".").reduce((o,k)=>o[k],C));
$("#hn").textContent=C.nombre;
$("#hl").innerHTML=C.historia.l.map((t,i)=>'<p class="ln" style="--i:'+i+";--d:"+(i%2?1:-1)+'">'+t+"</p>").join("");

/* escenas */
const secs=$$(".sc:not(.hide)");secs.forEach((s,i)=>{const d=document.createElement("i");d.setAttribute("role","button");d.setAttribute("aria-label","Escena "+(i+1));d.tabIndex=0;d.onclick=()=>s.scrollIntoView({behavior:"smooth"});d.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();s.scrollIntoView({behavior:"smooth"})}};$("#nv").appendChild(d)});
const io=new IntersectionObserver(es=>es.forEach(e=>{const i=secs.indexOf(e.target);if(e.intersectionRatio>=.55){e.target.classList.add("in");if(e.target.id==="fin")typeLetter();[...$("#nv").children].forEach((d,k)=>d.classList.toggle("on",k===i))}else if(e.intersectionRatio===0)e.target.classList.remove("in")}),{root:$("#s"),threshold:[0,.55]});
function begin(){secs.forEach(s=>io.observe(s))}
document.addEventListener("keydown",e=>{
 if($("#gate")&&!$("#gate").hidden)return;
 if(e.altKey||e.ctrlKey||e.metaKey||!["ArrowDown","ArrowUp","PageDown","PageUp"].includes(e.key))return;
 const target=e.target;
 if(target instanceof HTMLElement&&(target.isContentEditable||/^(INPUT|SELECT|TEXTAREA)$/.test(target.tagName)))return;
 e.preventDefault();
 const active=secs.findIndex(s=>s.classList.contains("in"));
 const current=active<0?0:active,step=e.key==="ArrowUp"||e.key==="PageUp"?-1:1;
 const next=Math.max(0,Math.min(secs.length-1,current+step));
 secs[next].scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
});
const RELEASE_AT=new URLSearchParams(location.search).has("preview")?0:new Date(2026,10,22,0,0,0,0).getTime();
const GATE_COMPLETED_KEY="angeli-letter-gate-completed";
let gateCountdown,gateOpening=false;
function hasCompletedGate(){
 try{return localStorage.getItem(GATE_COMPLETED_KEY)==="true"}
 catch(error){console.error("No se pudo comprobar si la prueba ya fue completada.",error);return false}
}
function markGateCompleted(){
 try{localStorage.setItem(GATE_COMPLETED_KEY,"true")}
 catch(error){console.error("No se pudo guardar que la prueba ya fue completada.",error)}
}
function openLetter(){
 if(Date.now()<RELEASE_AT||gateOpening)return;
 gateOpening=true;clearInterval(gateCountdown);
 const gate=$("#gate");let revealStarted=false;
 const reveal=()=>{if(revealStarted)return;revealStarted=true;document.body.classList.remove("waiting");begin();burst(190,innerWidth/2,innerHeight*.43)};
 const finish=()=>{document.body.classList.remove("celebrating");startGateChallenge(reveal)};
 document.body.classList.add("celebrating");$("#gate-title").textContent="El secreto despierta...";playSound("transition");
 burst(120,innerWidth/2,innerHeight*.43);
 setTimeout(()=>burst(80,innerWidth/2,innerHeight*.38),450);
 setTimeout(()=>{if(document.body.classList.contains("celebrating"))$("#gate-title").textContent="La carta te espera"},2300);
 if(matchMedia("(prefers-reduced-motion:reduce)").matches){finish();return}
 setTimeout(finish,4500);
}
function startGateChallenge(onSuccess){
 const challenge=$("#gate-challenge"),card=$(".gate-card"),board=$("#challenge-pad"),copy=$("#challenge-copy"),status=$("#challenge-status"),scoreLabel=$("#challenge-round"),timeLabel=$("#challenge-time");
 let seconds=30,timer=null,finished=false,locked=false,pairs=0,openCard=null;
 card.classList.add("challenge-mode");challenge.hidden=false;
 burst(70,innerWidth/2,innerHeight*.35);
 playSound("tap");
 function clearTimers(){if(timer)clearInterval(timer);timer=null}
 function setTime(value){timeLabel.textContent=value+" s"}
 function resetTimer(){
  seconds=30;setTime(seconds);
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{
   seconds--;setTime(Math.max(0,seconds));
   if(seconds<=0){
    clearTimers();status.textContent="Se mezclaron otra vez";
    setTimeout(startGame,900);
   }
  },1000);
 }
 function finishGame(){
  if(finished)return;
  finished=true;clearTimers();markGateCompleted();status.textContent="¡Memoria perfecta!";
  playSound("reveal");burst(90,innerWidth/2,innerHeight*.48);
  setTimeout(()=>{
   card.classList.remove("challenge-mode");challenge.hidden=true;
   $("#gate").hidden=true;document.body.classList.remove("celebrating");onSuccess();
  },1000);

 else if(kind==="reveal"){if(!playSample(ctx,"gift",.72,1.15,1.25)){fxRustle(ctx,.22,.1,3);fxTone(ctx,659,.28,"sine",.08,784);fxTone(ctx,784,.3,"sine",.075,988,.08)}}
 else if(kind==="transition"){
  if(!playSample(ctx,"swipe",.68,1.05,1.25))fxRustle(ctx,.8,.14,8);
  if(!playSample(ctx,"bow",.48,1.05,1,.0,.3))fxRustle(ctx,.46,.1,5);
  if(!playSample(ctx,"gift",.78,1.05,1.6,0,.62)){fxTone(ctx,587,.48,"sine",.08,740,.62);fxTone(ctx,740,.5,"sine",.07,988,.76);fxTone(ctx,988,.7,"sine",.065,1175,.92)}
  fxTone(ctx,523,.8,"sine",.05,659,.6);fxTone(ctx,659,.85,"sine",.045,784,.78);fxTone(ctx,784,1,"sine",.04,1046,1);fxTone(ctx,1046,1.1,"sine",.035,1318.5,1.2);
 }
 else if(kind==="scratch"){if(!playPaperSample(ctx,"paper",.52,1.5,.28))fxRustle(ctx,.16,.12,3)}
 else if(kind==="tap"){if(!playSample(ctx,"tap",.32,1.4,.22))fxTone(ctx,760,.045,"square",.025,480)}
 else if(kind==="spark"){if(!playSample(ctx,"gift",.3,1.6,.18))fxTone(ctx,880,.12,"sine",.025,1320)}
 else if(kind==="wrong"){if(!playSample(ctx,"tap",.22,.75,.22))fxTone(ctx,260,.16,"triangle",.04,170)}
}

function showAudioError(){
 song.dataset.error="1";
 $("#mu").textContent="♪ elegir MP3";
}
function startMusic(){
 song.dataset.wants="1";setMusicVolume();
 song.play().then(()=>{$("#mu").textContent="♪ silencio";song.dataset.error="0"}).catch(error=>{
  if(error.name==="NotAllowedError"){$("#mu").textContent="♪ toca para activar";return}
  if(error.name==="AbortError")return;
  showAudioError();
  console.error("No se pudo reproducir la música.",error);
 });
}
song.addEventListener("error",showAudioError);
$("#mu").onclick=()=>{if(song.dataset.error==="1"){audioFile.click();return}if(song.paused)startMusic();else{song.dataset.wants="0";song.pause();$("#mu").textContent="♪ música"}};
track.onchange=()=>{song.pause();song.dataset.error="0";if(localAudioUrl){URL.revokeObjectURL(localAudioUrl);localAudioUrl=""}song.src=track.value;song.currentTime=0;song.load();startMusic()};
audioFile.onchange=()=>{const file=audioFile.files&&audioFile.files[0];if(!file)return;if(localAudioUrl)URL.revokeObjectURL(localAudioUrl);localAudioUrl=URL.createObjectURL(file);song.dataset.error="0";song.src=localAudioUrl;song.currentTime=0;song.load();startMusic()};
$("#vl").oninput=()=>{$("#volume-value").textContent=$("#vl").value+"%";setMusicVolume()};
$("#vl").onchange=()=>playSound("tap");
document.addEventListener("visibilitychange",()=>{if(document.hidden)song.pause();else if(song.dataset.wants==="1")startMusic()});

/* partículas */
const cv=$("#cv"),cx=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion:reduce)").matches;let P=[],particleFrame=0;
function rs(){const r=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0)}rs();addEventListener("resize",rs);
const pc=["#e8869a","#f3c4cd","#efe4cb","#d6566f","#cfa957","#f7e3e8"];
function drawParticles(){
 particleFrame=0;cx.clearRect(0,0,innerWidth,innerHeight);
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.09;p.vx*=.995;p.a+=p.va;p.l-=.018;
  if(p.l<=0||p.y>innerHeight+30){P.splice(i,1);continue}
  cx.globalAlpha=Math.min(1,p.l*2);cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.beginPath();cx.ellipse(0,0,p.r,p.r*.55,0,0,6.3);cx.fill();cx.restore()
 }
 if(P.length)particleFrame=requestAnimationFrame(drawParticles);
}
function burst(n,x,y){
 if(still)return;
 const at=x!==undefined;
 for(let i=0;i<n&&P.length<160;i++)P.push({x:at?x:Math.random()*innerWidth,y:at?y:innerHeight+10,vx:(Math.random()-.5)*(at?5:3),vy:at?-2-Math.random()*4:-(4+Math.random()*7),r:3+Math.random()*5,a:Math.random()*6,va:(Math.random()-.5)*.15,c:pc[i%pc.length],l:1});
 if(P.length&&!particleFrame)particleFrame=requestAnimationFrame(drawParticles);
}

 $("#gate").hidden=true;document.body.classList.remove("waiting");begin();
}else{
 updateGateCountdown();if(!$("#gate").hidden)gateCountdown=setInterval(updateGateCountdown,1000);
